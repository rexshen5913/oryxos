#
# ── 樣本數規劃：情境試算不等於 power，以及下一輪該取多少 ──
#
# 先把兩件常被混為一談的事分開。**上一版紀錄只寫了 (a) 卻當成 (b) 用，是錯的**
# （Codex 審查抓到）。
#
# **(a) 情境試算**——「如果比例原封不動重現，那張分割表的 p 會是多少」。這是把同一組
# 比例等比放大，**不是樣本數需求**：
#
#   每組 n= 30   13/30 vs  7/30  →  p = 0.170   ← 這一輪在這裡
#   每組 n= 50   22/50 vs 12/50  →  p = 0.057
#   每組 n= 80   35/80 vs 19/80  →  p = 0.012
#
# 它不夠用的原因：真實抽樣不會剛好落在 43%／23%，會在它附近散開，而上表**忽略抽樣變異，
# 只算了單一情境**（把觀測比例直接代入放大，plug-in）。它**也不是「最好的情況」**——差距
# 更大的表格同樣可能抽到，那些表的 p 反而更小（Codex 審查指出，上一版這個說法不正確）。
#
# **(b) power**——對兩組二項分佈的所有結果組合積分後，「有多少機率會拒絕虛無」。
# **power 必須先假設一個真實效應才算得出來**，這裡代入的 0.433／0.233 正是第三輪自己的
# 觀測值，所以下表每一列都是**條件式**的：「**如果**真實效應恰好是 43% → 23%」。
# α = 0.05、雙尾 Fisher exact：
#
#   每組 n= 30   power = 0.28
#   每組 n= 50   power = 0.49
#   每組 n= 80   power = 0.72   ← (a) 看起來已「跨過門檻」，這裡四次會漏掉一次
#   每組 n= 95   power = 0.80   ← 慣例門檻
#   每組 n=110   power = 0.86
#
# 兩張表在 n=80 差最遠，而那正是上一版寫成「跨過門檻」的那一格。
#
# ⚠ **這張表不能拿來解釋本輪為什麼不顯著——那是 observed power 謬誤（Codex 審查抓到）。**
#
# 上一版寫「這一輪的 power 只有 0.28，所以 p = 0.170 是樣本不足的證據」。錯在哪：0.28 是
# **拿同一批資料的觀測值當真實效應**回頭算的 post-hoc observed power，它是 p 值的單調
# 函數——p 越大算出來必然越小。「p 大 → 觀測 power 小 → 所以樣本不足」等於把 p = 0.170
# 換個單位再講一次，繞回原點，不帶任何新資訊。
#
# **本輪能下的結論只有一句：結果不確定。** p = 0.170 既不支持「有 20 個百分點的效果」，
# 也不支持「沒有效果」——這個設計分不開這兩者。上表唯一的正當用途是**規劃下一輪**：
# 若真實效應是 43% → 23%，n=30 有七成機率量不到，所以下一輪不該再用 n=30。
#
# 算法（可重算，無外部依賴）：條件式 Fisher exact 雙尾 p ＝ 給定邊際下機率不大於觀測表
# 的所有超幾何表格機率和；power ＝ 對 x1 ~ B(n, p1)、x2 ~ B(n, p2) 的所有 (x1, x2) 組合，
# 把 p ≤ α 者的聯合機率加總。
#
# **「所需 n」是逐格掃出來的，不是二分搜尋出來的。** Fisher exact 是離散檢定，power 對 n
# **不保證單調**——實測到 15 個百分點那組在 n=150 是 0.803、n=151 反而是 0.802。二分搜尋
# 可能停在錯的邊界，所以下表三個門檻都用門檻附近逐格掃描複核過（81／150／347 皆為窗內
# 首次達 0.80 且其後不再回落）。
#
# ── 下一輪若要做確認性實驗，先登記這些，跑滿才看資料 ──
#
#   主要切點   **謊稱率（人工判讀），只有這一個。**
#   α          0.05，雙尾 Fisher exact
#   目標 power 0.80
#   效應量     43% → 23%（絕對差 20 個百分點）。**這是 pilot effect assumption，不是
#              已知的真實效應**——它取自第三輪的觀測值，而 pilot 的觀測效應系統性偏大
#              （能被小樣本看見的，多半是被抽樣運氣放大的那些）。第四輪同一個切點只量到
#              27% → 23%；兩輪控制組合併是 21/60 = 35%。
#   樣本數     **每組 95**（在上述假設成立時由 (b) 表倒推），A／B 交錯取樣
#   次要切點   iteration ≥ 4、iteration = 2。**描述性報告，不用來下結論**，因此不佔
#              α 預算。
#   停止規則   **固定 n，不做期中查看，不因為還沒顯著就加樣本。** 看到中途結果再決定
#              要不要續跑，會把實際 α 推高到遠超過 0.05；前三輪那種「先跑 30 輪看一下」
#              的節奏適合探索，不能拿來下確認性結論。
#
# ── sensitivity analysis：假設錯了的話，n=95 會變成什麼樣 ──
#
# 上面那個 n=95 完全站在「真實降幅就是 20 個百分點」這個假設上。把控制組固定在兩輪合併
# 的 35%，讓假設的真實降幅變動（α = 0.05）：
#
#   假設的真實降幅   n=95 power   n=130 power   達 0.80 power 所需 n
#    20 個百分點        0.87         0.96              81
#    15 個百分點        0.59         0.74             150
#    10 個百分點        0.27         0.37             347
#     5 個百分點        0.09         0.11           >1200
#
# **讀法**：n=95 只在「真實效應接近 pilot 觀測值」時夠用。若實際降幅是 10 個百分點，
# n=95 的 power 只有 0.27——跑完大概率又是一個說不出結論的結果。要把那個情境做到 0.80
# 需要每組 347 輪，也就是 **694 段**：以每 60 段約 $0.0105 換算，API 費用只有約 $0.12，
# **真正的天花板是 694 段人工判讀**（而人工判讀是必要的，理由見下一節）。
#
# 所以下一輪開跑前得先回答一個非統計的問題：**多小的改善才值得為它改訊息？** 若答案是
# 「小於 15 個百分點就不值得」，n=150 是自洽的選擇；若堅持 n=95，就要接受它只回答得了
# 「有沒有大效應」這一個問題，回答不了「有沒有小效應」。
#
# **為什麼只設一個主要切點**：三個切點若都要能下結論，就得共用 α 預算——Bonferroni
# 校正後每個是 0.05/3 = 0.0167，而同樣的效應量在那個門檻下，**n=95 的 power 掉到
# 0.66**，要回到 0.80 得 **n=130**（同一套算法）：
#
#   α=0.0167   n= 95  power = 0.66     ← 沿用 n=95 會偷偷變成欠功率設計
#              n=110  power = 0.74
#              n=130  power = 0.82
#
# 也就是說「登記三個切點 ＋ Bonferroni ＋ n=95」是自相矛盾的（本輪自查發現）。兩條路
# 選一條：**收成單一主要切點跑 n=95**，或**維持三個共同主要切點但跑 n=130**。這裡選前者
# ——謊稱率才是 issue #58 的症狀本身，iteration 是旁證；而 n 從 95 漲到 130 等於多花
# 約 37% 的錢去買兩個旁證的統計效力，不值得。
#
