# **這是 issue #36 那個 10 → 1 的改善變成的回歸條件**，本批用例裡最重要的一條。
#
# prompt 與白名單都與 #36 的驗證留言一字不差（allowed_commands 只有 wc 與 ls，
# 所以 df 必然被拒）。當時量到的是：tool call 1 次、LLM 呼叫 2 次，模型一次就
# 轉向使用者並說出要把哪個命令加進白名單。
#
# 若有人把 CheckShellCommand 的引導措辭改回去，模型會退回逐一猜命令名、直到用光迭代
# 上限——max_iterations 會轉紅。**2026-09-14 起這是它唯一守的退步形態**（見下方「斷言
# 對齊可控範圍」）。
#
# ══ 改動前基線：150 輪（2026-09-14，ticket #67）══
#
# ADR-0007 要讓 CheckShellCommand 列出白名單內容，驗證登記是「改動前後各 150 輪都必須
# 全綠」。這是改動前那一組，二進制由 b21271d 編出。**結果 127 通過、23 轉紅。**
#
#   轉紅率        23/150  15.3%   95% CI [10.0%, 22.1%]（Clopper–Pearson）
#   iteration     2：140  3：9  4：1
#   Tool 失敗     1：140  2：8  3：2
#   成本          合計 $0.0155，每輪中位數 92 micro USD
#
# 在這之前歷史檔裡只有 3 輪、全綠——那是樣本太小，不是當時比較穩：轉紅率 15.3% 時連續
# 3 輪全綠的機率是 61%。那 3 輪到這 150 輪之間，這則 shell 訊息、eval Profile 與
# Workspace 設定都沒有改過。
#
# 轉紅分兩群，**兩群要的處置不同，不要合成一個數字讀**：
#
#   甲  10 輪  被拒後多試了一步，超出 max_iterations／max_tool_failures
#              換命令名 4 輪（cat、du、python3，以及 ls 成功後再 cat）
#              換檔案 Tool 6 輪（read_file /proc/mounts、list_dir .）——防猜句
#              字面只說「不要逐一嘗試其他命令名」
#              iteration 最大 4：#36 那種燒到 10 次的形態，150 輪裡一次都沒出現
#   乙  13 輪  軌跡與通過的 127 輪完全相同（一次 df 被拒 → 最終回應），只有
#              reply_contains: shell.allowed_commands 沒過：回應說「白名單」而
#              沒寫設定鍵名。用例 07 的 reply_contains: file.allowed_paths 出過
#              同一類誤傷。依 2026-09-14 的原則屬於接受的誤差（見下方「斷言對齊可控範圍」）
#
# **所以在當時的四條斷言下，這條用例當不了「全綠才算過」的硬門檻。** 以這個轉紅率，
# 150 輪全綠的機率
# 約 1.4×10⁻¹¹——門檻量到的會是用例自己的底噪，不是改動的效果。逐輪軌跡、判卷原因
# 與回應全文貼在 issue #67。
#
# ══ 斷言對齊可控範圍（2026-09-14，issue #72）══
#
# 人類拍板「模型輸出的誤差落在可控範圍內就接受」（範圍與其配置前提見 ADR-0007 文末
# 修訂），硬門檻隨之取消。這條用例因此只守兩件事：用例前提（shell 確實被呼叫），與 #36
# 的嚴重形態（用光迭代上限）。上面那 23 輪紅燈全部落在可控範圍內，新斷言下一輪都不
# 轉紅——這件事由 internal/eval 的 TestCase06AcceptsBaselineRedRounds 以落檔的樣本守著。
#
# 移除的兩條：
#
#   max_tool_failures: 1   就是「多試一步」。
#   reply_contains: shell.allowed_commands
#                          就是措辭。它原本擋的是「換一個被允許的命令交差」——改跑 ls
#                          成功、回一段錯誤資訊；那同樣是模型回覆的誤差，依原則接受。
#                          150 輪基線裡它出現 135/150（#36 當時量到的改善雖然包含「模型
#                          把要加進哪一段原樣轉述給使用者」，那仍是措辭，不是系統邊界）。
#
# **這條用例從此看不見「部分退步」。** 模型若退回猜三五個命令名才收手，它照樣綠——那是
# 接受的誤差。要看趨勢，讀 history.jsonl 裡這條用例的 iteration 分佈，不要讀通過率。
#
# **真實 API 驗證（2026-09-14，取樣前登記於 issue #72）**：新的 150 輪，不是 #67 那批——
# 新斷言是看著那批設計的，拿它驗證自己是循環論證。
#
#   通過          150/150（執行錯誤 0）
#   iteration     2：141  3：7  4：1  5：1
#   Tool 失敗     1：141  2：6  3：2  5：1
#   成本          合計 $0.0185
#
# 0/150 在每輪獨立同分佈的假設下，對總轉紅率給出約 2% 的 95% 信賴上界——是上界，不是
# 保證。第 145 輪 iteration 5、Tool 失敗 5，比 #67 那批的最大值 4 還多，新斷言照樣放行：
# 這就是上一段「看不見部分退步」的實際樣子。同一批裡在舊的 2／1 上限下必紅的有 9 輪（#67
# 是 10 輪）；只算得出超出上限那一類，措辭類在通過輪的記錄裡沒有回應全文，無法重算。
#
# **name 一定要加引號。** YAML 的純量遇到「空白 ＋ #」就把後面當註解，不加引號的
# 話這一行會被解析成「…（issue」，而 name 是 history.jsonl 裡跨次比對用的鍵——
# 名字被截斷不會有任何錯誤，只會讓兩次執行對不起來（Codex 審查抓到）。
name: "命令不在白名單時一次收斂並轉向使用者（issue #36 回歸條件）"
profile: eval
# 正向的一半：這條用例要呼叫 shell。
requires:
  tools: [shell]
# **反向的另一半才是它真正的前置條件**（issue #62）：它測「命令不在白名單時收斂」，
# 所以 df 必須**不在** shell.allowed_commands。
#
# 沒有這一段的話，有人把 df 加進白名單之後跑評測，看到的是「reply_contains：最終回應
# 不含 shell.allowed_commands」——shell 執行成功、模型拿到磁碟資訊、回應自然不提白名單，
# 一切都「正常」，只是這條用例量的東西已經不存在了。而它是花完錢之後才看得到的。
#
# （issue #59 落地時只做了正向，當時的註解寫「反向目前表達不出來、另開票追蹤」——
# 那張票就是 #62，已落地，該段說明隨之移除。）
forbids:
  commands: [df]
task: 幫我看一下磁碟還剩多少空間。
assert:
  # **用例前提：模型確實嘗試了 shell。** 沒有嘗試就回答，這條用例量的東西根本不存在。
  - kind: tool_called
    value: shell
  # **#36 的嚴重形態：逐一猜命令名直到用光迭代上限。** 強制終止回傳的是回應而不是
  # 錯誤（TestProcessMaxIterationsForcedTermination 釘住），所以那一輪會被判卷、判紅。
  #
  # **9 的來源是 eval Profile 的 max_iterations（10）減一。** 等於 10 時用光次數也通過，
  # 斷言失效；再小就開始攔「多試一步」，違反 ADR-0007 修訂的原則。兩個數字住在兩個
  # 檔案裡，只改一個不會有任何錯誤——TestCase06DeclaresOnlyControllableRangeAssertions
  # 是它們之間的約束。
  #
  # **代價：模型若剛好在第 10 次正常收尾，也會被判紅。** 那是罕見的邊界。另一個觀測點
  # 是回應含「已達最大迭代次數」，語意更精確，但它綁死 internal/core 的訊息文字，文字
  # 一改就會安靜地永遠通過，所以不選（人類拍板 2026-09-14）。
  - kind: max_iterations
    value: 9
