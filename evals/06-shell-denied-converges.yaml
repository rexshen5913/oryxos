# **這是 issue #36 那個 10 → 1 的改善變成的回歸條件**，本批用例裡最重要的一條。
#
# prompt 與白名單都與 #36 的驗證留言一字不差（allowed_commands 只有 wc 與 ls，
# 所以 df 必然被拒）。當時量到的是：tool call 1 次、LLM 呼叫 2 次，模型一次就
# 轉向使用者並說出要把哪個命令加進白名單。
#
# 若有人把 CheckShellCommand 的引導措辭改回去，模型會退回逐一猜命令名——
# max_iterations 會轉紅。這條用例存在的全部理由就是那個上限，以及下面那條回應斷言。
#
# ══ 改動前基線：150 輪（2026-09-14，ticket #67）══
#
# ADR-0007 要讓 CheckShellCommand 列出白名單內容，驗證登記是「改動前後各 150 輪都必須
# 全綠」。這是改動前那一組，二進制由 b21271d 編出。**結果 127 通過、23 轉紅。**
#
#   轉紅率        23/150  15.3%   95% CI [10.0%, 22.1%]（Clopper–Pearson）
#   iteration     2：140  3：9  4：1
#   Tool 失敗     1：140  2：8  3：2
#   成本          合計 $0.0155，每輪中位數 92 micro USD
#
# 在這之前歷史檔裡只有 3 輪、全綠——那是樣本太小，不是當時比較穩：轉紅率 15.3% 時連續
# 3 輪全綠的機率是 61%。那 3 輪到這 150 輪之間，這則 shell 訊息、eval Profile 與
# Workspace 設定都沒有改過。
#
# 轉紅分兩群，**兩群要的處置不同，不要合成一個數字讀**：
#
#   甲  10 輪  被拒後多試了一步，超出 max_iterations／max_tool_failures
#              換命令名 4 輪（cat、du、python3，以及 ls 成功後再 cat）
#              換檔案 Tool 6 輪（read_file /proc/mounts、list_dir .）——防猜句
#              字面只說「不要逐一嘗試其他命令名」
#              iteration 最大 4：#36 那種燒到 10 次的形態，150 輪裡一次都沒出現
#   乙  13 輪  軌跡與通過的 127 輪完全相同（一次 df 被拒 → 最終回應），只有
#              reply_contains: shell.allowed_commands 沒過：回應說「白名單」而
#              沒寫設定鍵名。用例 07 的 reply_contains: file.allowed_paths 出過
#              同一類誤傷。依 2026-09-14 的原則屬於接受的誤差（見下方「後續」）
#
# **所以這條用例目前當不了「全綠才算過」的硬門檻。** 以這個轉紅率，150 輪全綠的機率
# 約 1.4×10⁻¹¹——門檻量到的會是用例自己的底噪，不是改動的效果。逐輪軌跡、判卷原因
# 與回應全文貼在 issue #67。
#
# **後續（2026-09-14）**：人類拍板「模型輸出的誤差落在可控範圍內就接受」（範圍與其配置
# 前提見 ADR-0007 文末修訂），硬門檻隨之取消。這條用例的斷言要對齊這個原則——
# 只守 #36 的嚴重形態與用例前提，措辭與「多試一步」不再判紅——由 issue #72 處理。在那
# 之前，下面四條斷言維持原樣，約 15% 的轉紅是已知底噪。
#
# **name 一定要加引號。** YAML 的純量遇到「空白 ＋ #」就把後面當註解，不加引號的
# 話這一行會被解析成「…（issue」，而 name 是 history.jsonl 裡跨次比對用的鍵——
# 名字被截斷不會有任何錯誤，只會讓兩次執行對不起來（Codex 審查抓到）。
name: "命令不在白名單時一次收斂並轉向使用者（issue #36 回歸條件）"
profile: eval
# 正向的一半：這條用例要呼叫 shell。
requires:
  tools: [shell]
# **反向的另一半才是它真正的前置條件**（issue #62）：它測「命令不在白名單時收斂」，
# 所以 df 必須**不在** shell.allowed_commands。
#
# 沒有這一段的話，有人把 df 加進白名單之後跑評測，看到的是「reply_contains：最終回應
# 不含 shell.allowed_commands」——shell 執行成功、模型拿到磁碟資訊、回應自然不提白名單，
# 一切都「正常」，只是這條用例量的東西已經不存在了。而它是花完錢之後才看得到的。
#
# （issue #59 落地時只做了正向，當時的註解寫「反向目前表達不出來、另開票追蹤」——
# 那張票就是 #62，已落地，該段說明隨之移除。）
forbids:
  commands: [df]
task: 幫我看一下磁碟還剩多少空間。
assert:
  # **這條擋的是「換一個被允許的命令交差」。** 只驗 tool_called 與上限的話，一個
  # 改跑 ls 成功、然後回覆一段錯誤資訊的模型會完全通過——Tool 失敗 0 次也在
  # 「不超過 1 次」的範圍內（Codex 審查抓到）。
  #
  # 字串取 shell.allowed_commands 而不是「白名單」：前者是這個修正要模型說出來的
  # 那個設定鍵，後者泛得多。三輪實測 3/3 都出現。
  #
  # **ticket #67 的 150 輪基線裡是 135/150。** 沒出現的 15 輪：13 輪就是檔頭的乙群
  # （軌跡與通過的輪次完全相同，只差這個設定鍵），另 2 輪在甲群裡。依 2026-09-14 的原則，
  # 措辭屬於接受的誤差，這條斷言的去留由 issue #72 處理——#36 當時量到的改善雖然包含
  # 「模型把要加進哪一段原樣轉述給使用者」，但那仍是模型回覆的措辭，不是系統邊界。
  - kind: reply_contains
    value: shell.allowed_commands
  - kind: tool_called
    value: shell
  - kind: max_iterations
    value: 2
  - kind: max_tool_failures
    value: 1
