name: 🐛 Bug 回報
description: 回報 OryxOS 的錯誤行為
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感謝回報！請先搜尋[既有 Issue](https://github.com/rexshen5913/oryxos/issues?q=is%3Aissue) 避免重複。

        ⚠️ **安全漏洞請勿在此回報**，改用 [私密漏洞回報](https://github.com/rexshen5913/oryxos/security/advisories/new)。

        ℹ️ 本專案目前處於文檔規劃期，尚無 Go 程式碼。若你要回報的是**文檔錯誤或不一致**，同樣歡迎使用本範本。

  - type: textarea
    id: what-happened
    attributes:
      label: 發生了什麼
      description: 清楚描述你遇到的問題。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 預期行為
      description: 你原本預期會發生什麼？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 重現步驟
      description: 讓我們能重現問題的最小步驟。
      placeholder: |
        1. 執行 `oryxos ...`
        2. 輸入 ...
        3. 觀察到 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相關日誌或錯誤輸出
      description: 貼上日誌、堆疊追蹤或錯誤訊息。會自動以程式碼區塊呈現，不需加上反引號。
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: OryxOS 版本
      description: 版本號或 commit SHA。
      placeholder: "例：v0.1.0 或 2ff720d"
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go 版本
      description: "`go version` 的輸出。"
      placeholder: "例：go1.24.0 darwin/arm64"
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: 作業系統
      placeholder: "例：macOS 14.6 / Ubuntu 24.04 / Windows 11"
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 我已搜尋過既有 Issue，確認這不是重複回報
          required: true
        - label: 這不是安全漏洞（安全問題請走私密回報流程）
          required: true
